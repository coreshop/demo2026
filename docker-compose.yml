name: coreshop5-demo

networks:
    cors_dev:
        external: true

services:
    db:
        image: mysql:8
        networks:
            cors_dev:
                aliases:
                    - coreshop5-demo
        working_dir: /application
        command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_general_ci]
        volumes:
            - database:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=ROOT
            - MYSQL_DATABASE=pimcore
            - MYSQL_USER=pimcore
            - MYSQL_PASSWORD=pimcore

    nginx:
        image: nginx:stable-alpine
        volumes:
            - .:/var/www/html:cached
            -  ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
            - php-debug
        links:
            - php:fpm
            - php-debug:fpm-debug
        networks:
            - default
            - cors_dev
        labels:
            - traefik.enable=true
            - traefik.http.routers.coreshop5_demo.rule=Host(`coreshop5-demo.localhost`)
            - traefik.http.routers.coreshop5_demo.entrypoints=cors_dev
            - traefik.http.routers.coreshop5_demo.tls=true
            - traefik.http.services.coreshop5_demo.loadbalancer.server.port=80
            - traefik.docker.network=cors_dev

    php:
        image: ghcr.io/cors-gmbh/pimcore-docker/php-fpm:8.3-alpine3.21-7.1.0
        networks:
            - cors_dev
            - default
        environment:
            - COMPOSER_AUTH=${COMPOSER_AUTH}
        links:
            - db:database
            - opensearch:os
            - mercure:mercure
        depends_on:
            - db
        volumes:
            - .:/var/www/html:cached

    php-debug:
        image: ghcr.io/cors-gmbh/pimcore-docker/php-fpm-debug:8.3-alpine3.21-7.1.0
        networks:
            - cors_dev
            - default
        depends_on:
            - db
        links:
            - db:database
            - opensearch:os
            - mercure:mercure
        volumes:
            - .:/var/www/html:cached
        environment:
            PHP_IDE_CONFIG: "serverName=localhost"
            COMPOSER_AUTH: ${COMPOSER_AUTH}

    supervisord:
        image: ghcr.io/cors-gmbh/pimcore-docker/php-supervisord:8.3-alpine3.21-7.1.0
        depends_on:
            - db
        links:
            - db:database
            - opensearch:os
            - mercure:mercure
        volumes:
            - ./:/var/www/html:cached
            - ./.docker/supervisord/coreshop.conf:/etc/supervisor/conf.d/coreshop.conf:ro
            - ./.docker/supervisord/pimcore.conf:/etc/supervisor/conf.d/pimcore.conf:ro
        networks:
            - cors_dev
            - default

    opensearch:
        image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.11.1}
        environment:
            discovery.type: single-node
            node.name: opensearch
            OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
            plugins.security.disabled: 'true'
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
                hard: 65536
        networks:
            - default
            - cors_dev
        volumes:
            - opensearch-data:/usr/share/opensearch/data

    mercure:
        image: dunglas/mercure:latest
        networks:
            - cors_dev
            - default
        environment:
            # Uncomment the following line to disable HTTPS
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: 'wrMZk0YSUABq3GuSGKcxmjAZXv9lJYB3'
            MERCURE_SUBSCRIBER_JWT_KEY: 'wrMZk0YSUABq3GuSGKcxmjAZXv9lJYB3'
        # Uncomment the following line to enable the development mode
        command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
        labels:
            - traefik.enable=true
            - traefik.http.routers.coreshop_coreshop4_demo_mecure.rule=Host(`coreshop-coreshop4-demo-mercure.localhost`)
            - traefik.http.routers.coreshop_coreshop4_demo_mecure.entrypoints=cors_dev
            - traefik.http.routers.coreshop_coreshop4_demo_mecure.tls=true
            - traefik.http.services.coreshop_coreshop4_demo_mecure.loadbalancer.server.port=80
            - traefik.docker.network=cors_dev
        volumes:
            - mercure-data:/data
            - mercure-config:/config

volumes:
    database:
    mercure-data:
    mercure-config:
    opensearch-data: