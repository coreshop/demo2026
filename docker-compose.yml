networks:
    cors_dev:
        external: true
    coreshop_coreshop4_demo:
        external: false

services:
    db:
        image: mysql:8
        container_name: coreshop-coreshop4-demo
        networks:
            - cors_dev
            - coreshop_coreshop4_demo
        working_dir: /application
        command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_general_ci]
        volumes:
            - coreshop-coreshop4-demo-database:/var/lib/mysql
        environment:
            - MYSQL_ROOT_PASSWORD=ROOT
            - MYSQL_DATABASE=pimcore
            - MYSQL_USER=pimcore
            - MYSQL_PASSWORD=pimcore

    nginx:
        image: nginx:stable-alpine
        volumes:
            - .:/var/www/html:cached
            -  ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
            - php-debug
        networks:
            - cors_dev
            - coreshop_coreshop4_demo
        labels:
            - traefik.enable=true
            - traefik.http.routers.coreshop_coreshop4_demo.rule=Host(`coreshop-coreshop4-demo.localhost`)
            - traefik.http.routers.coreshop_coreshop4_demo.entrypoints=cors_dev
            - traefik.http.routers.coreshop_coreshop4_demo.tls=true
            - traefik.http.services.coreshop_coreshop4_demo.loadbalancer.server.port=80
            - traefik.docker.network=cors_dev

    php:
        image: git.e-conomix.at:5050/cors/docker/php-alpine-3.20-fpm:8.2-5.2.4
        container_name: coreshop-coreshop4-demo-php
        networks:
            - coreshop_coreshop4_demo
        environment:
            - COMPOSER_AUTH=${COMPOSER_AUTH}
        depends_on:
            - db
        volumes:
            - .:/var/www/html:cached

    php-debug:
        image: git.e-conomix.at:5050/cors/docker/php-alpine-3.20-fpm-debug:8.2-5.2.4
        container_name: coreshop-coreshop4-demo-php-debug
        networks:
            - coreshop_coreshop4_demo
        depends_on:
            - db
        volumes:
            - .:/var/www/html:cached
        environment:
            PHP_IDE_CONFIG: "serverName=localhost"
            COMPOSER_AUTH: ${COMPOSER_AUTH}
            XDEBUG_HOST: 198.19.248.254
            XDEBUG_TRIGGER: PHPSTORM

    supervisord:
        image: git.e-conomix.at:5050/cors/docker/php-alpine-3.20-supervisord:8.2-5.2.4
        depends_on:
            - db
        volumes:
            - ./:/var/www/html:cached
            - ./.docker/supervisord/coreshop.conf:/etc/supervisor/conf.d/coreshop.conf:ro
            - ./.docker/supervisord/pimcore.conf:/etc/supervisor/conf.d/pimcore.conf:ro
        networks:
            - coreshop_coreshop4_demo

    opensearch:
        image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.11.1}
        container_name: opensearch
        environment:
            discovery.type: single-node
            node.name: opensearch
            OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
            plugins.security.disabled: 'true'
        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
                hard: 65536
        networks:
            - coreshop_coreshop4_demo
        volumes:
            - opensearch-data:/usr/share/opensearch/data

    mercure:
        image: dunglas/mercure:latest
        container_name: mercure
        networks:
            - coreshop_coreshop4_demo
        environment:
            # Uncomment the following line to disable HTTPS
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: 'wrMZk0YSUABq3GuSGKcxmjAZXv9lJYB3'
            MERCURE_SUBSCRIBER_JWT_KEY: 'wrMZk0YSUABq3GuSGKcxmjAZXv9lJYB3'
        # Uncomment the following line to enable the development mode
        command: /usr/bin/caddy run --config /etc/caddy/dev.Caddyfile
        labels:
            - traefik.enable=true
            - traefik.http.routers.coreshop_coreshop4_demo_mecure.rule=Host(`coreshop-coreshop4-demo-mercure.localhost`)
            - traefik.http.routers.coreshop_coreshop4_demo_mecure.entrypoints=cors_dev
            - traefik.http.routers.coreshop_coreshop4_demo_mecure.tls=true
            - traefik.http.services.coreshop_coreshop4_demo_mecure.loadbalancer.server.port=80
            - traefik.docker.network=cors_dev
        volumes:
            - coreshop-demo-mercure-data:/data
            - coreshop-demo-mercure-config:/config

volumes:
    coreshop-coreshop4-demo-database:
    coreshop-demo-mercure-data:
    coreshop-demo-mercure-config:
    opensearch-data: