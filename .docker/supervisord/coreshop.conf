[program:coreshop_index]
command=php /var/www/html/bin/console messenger:consume coreshop_index --memory-limit=200M --time-limit=300
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:coreshop_notification]
command=php /var/www/html/bin/console messenger:consume coreshop_notification --memory-limit=200M --time-limit=300
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true