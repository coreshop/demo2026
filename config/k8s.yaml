monolog:
    handlers:
        main:
            type: stream
            path: "php://stdout"
            level: error
        console:
            type: console

framework:
    trusted_proxies: '10.0.0.0/8'
    trusted_headers: [ 'x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port' ]
