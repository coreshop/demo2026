stages:
    - build
    - manifest

variables:
    TAG: $CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA
    APP_ENV: dev
    GCP_URL: europe-west3-docker.pkg.dev

daily_update:on-schedule:
    stage: build
    image:
        name: pimcore/pimcore:PHP8.0-cli
        entrypoint: [""]
    rules:
        -   if: $CI_PIPELINE_SOURCE == "schedule"
    before_script:
        - apt-get update && apt-get install -y git
        # Clone the repository via HTTPS inside a new directory
        - git remote set-url origin "https://${GITLAB_USERNAME}:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

        # Set the displayed user with the commits that are about to be made
        - git config --global user.email "${GIT_USER_EMAIL:-$GITLAB_USER_EMAIL}"
        - git config --global user.name "${GIT_USER_NAME:-$GITLAB_USER_NAME}"
    script:
        - composer update
        - git add .
        - git status
        - git commit -m "Update composer.lock"
        - git push origin HEAD:main || true
    tags:
        - cors

build_and_push:
    stage: build
    image: docker:stable
    rules:
        -   if: $CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE != "schedule"
    before_script:
        - base64 -d $GOOGLE_ARTIFACT_REGISTRY | docker login -u _json_key --password-stdin https://$GCP_URL
        - export GCP_REGISTRY_IMAGE=$(echo "$GCP_URL/cors-wolke/cors/$CI_PROJECT_PATH" | tr '[:upper:]' '[:lower:]')
    script:
        #- docker build . --tag $CI_REGISTRY_IMAGE/php:$TAG --target=cors_php --build-arg COMPOSER_AUTH="$COMPOSER_AUTH"
        - docker build . --tag $GCP_REGISTRY_IMAGE/nginx:$TAG --target=cors_nginx --build-arg COMPOSER_AUTH="$COMPOSER_AUTH"
        - docker build . --tag $GCP_REGISTRY_IMAGE/php-alpine-fpm:$TAG --target=cors_php --build-arg COMPOSER_AUTH="$COMPOSER_AUTH"

        #- docker push $CI_REGISTRY_IMAGE/php:$TAG
        - docker push $GCP_REGISTRY_IMAGE/nginx:$TAG
        - docker push $GCP_REGISTRY_IMAGE/php-alpine-fpm:$TAG
    tags:
        - cors

update_manifest:
    stage: manifest
    image: alpine
    needs:
        - job: build_and_push
    rules:
        - if: $CI_COMMIT_REF_NAME == "main" && $CI_PIPELINE_SOURCE != "schedule"
    variables:
        CD_CHART_REPO: coreshop3-demo-manifest
        CD_GIT_REPOSITORY: git.e-conomix.at/coreshop/$CD_CHART_REPO.git
        CD_MANIFEST_FILE: Chart.yaml
        CD_MANIFEST_VALUES_FILE: values.yaml
    script:
        - apk add --no-cache git yq
        - git config --global user.name $CI_PROJECT_NAME
        - git config --global user.email $CI_PROJECT_NAME"-manifest@cors.gmbh"
        - git clone https://gitlab-ci-token:${CD_PUSH_TOKEN}@${CD_GIT_REPOSITORY}
        - cd $CD_CHART_REPO
        - git checkout $CI_COMMIT_REF_NAME 2>/dev/null || $CI_COMMIT_REF_NAME checkout -b foo

        - yq -i eval ".appVersion = \"$TAG\"" $CD_MANIFEST_FILE
        - yq -i eval ".php.image.tag = \"$TAG\"" $CD_MANIFEST_VALUES_FILE
        - yq -i eval ".nginx.image.tag = \"$TAG\"" $CD_MANIFEST_VALUES_FILE

        - cat $CD_MANIFEST_FILE
        - git commit -am "[$CI_COMMIT_REF_NAME] update image Tag to \"$TAG\""
        - git push origin $CI_COMMIT_REF_NAME
    tags:
        - cors