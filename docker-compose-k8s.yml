networks:
    cors_dev:
        external: true

services:
    db:
        image: mysql:8
        container_name: coreshop-demo4
        networks:
            - cors_dev
        environment:
            - MYSQL_ROOT_PASSWORD=ROOT
            - MYSQL_DATABASE=pimcore
            - MYSQL_USER=pimcore
            - MYSQL_PASSWORD=pimcore

    php:
        build:
            context: ./
            target: cors_php
            args:
                - COMPOSER_AUTH=${COMPOSER_AUTH}
        container_name: coreshop-demo4-php
        networks:
            - cors_dev
        depends_on:
            - db
        environment:
            - DATABASE_DRIVER=pdo_mysql
            - DATABASE_HOST=coreshop-demo4
            - DATABASE_PORT=3306
            - DATABASE_NAME=pimcore
            - DATABASE_USER=pimcore
            - DATABASE_PASSWORD=pimcore
            - DATABASE_VERSION=8.0.26
            - PIMCORE_INSTALL_ADMIN_USERNAME=admin
            - PIMCORE_INSTALL_ADMIN_PASSWORD=admin

    supervisord:
        build:
            context: ./
            target: cors_php_supervisord
            args:
                - COMPOSER_AUTH=${COMPOSER_AUTH}
        container_name: coreshop-demo4-supervisord
        networks:
            - cors_dev
        depends_on:
            - db
        environment:
            - DATABASE_DRIVER=pdo_mysql
            - DATABASE_HOST=coreshop-demo4
            - DATABASE_PORT=3306
            - DATABASE_NAME=pimcore
            - DATABASE_USER=pimcore
            - DATABASE_PASSWORD=pimcore
            - DATABASE_VERSION=8.0.26
            - PIMCORE_INSTALL_ADMIN_USERNAME=admin
            - PIMCORE_INSTALL_ADMIN_PASSWORD=admin

    nginx:
        build:
            context: ./
            target: cors_nginx
            args:
                - COMPOSER_AUTH=${COMPOSER_AUTH}
        container_name: coreshop-datahub-nginx
        depends_on:
            - php
        volumes:
            - .docker/nginx/nginx-default.conf:/etc/nginx/conf.d/default.conf
        networks:
            - cors_dev
        labels:
            - traefik.enable=true
            - traefik.http.routers.coreshop_demo4.rule=Host(`coreshop-demo4.localhost`)
            - traefik.http.routers.coreshop_demo4.entrypoints=cors_dev
            - traefik.http.routers.coreshop_demo4.tls=true
            - traefik.http.services.coreshop_demo4.loadbalancer.server.port=80
            - traefik.docker.network=cors_dev
