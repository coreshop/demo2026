name: Build

# Builds the three images of the demo and, on pushes to main, pushes them to the
# GCP Artifact Registry and bumps the image tags in the manifest repository.
# Required secrets: GOOGLE_CREDENTIALS (service account JSON with Artifact Registry
# writer), MANIFEST_PUSH_TOKEN (fine-grained PAT, contents:write on the manifest repo).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: europe-west3-docker.pkg.dev
  IMAGE_BASE: europe-west3-docker.pkg.dev/cors-wolke/cors/coreshop/demo5
  MANIFEST_REPO: coreshop/demo5-manifest

jobs:
  build:
    name: Build ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: php-alpine-fpm, target: cors_php }
          - { name: php-alpine-supervisord, target: cors_php_supervisord }
          - { name: nginx, target: cors_nginx }
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: echo "tag=main-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
          build-args: |
            APP_ENV=prod
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  manifest:
    name: Update manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Image tag
        id: tag
        run: echo "tag=main-$(echo ${{ github.sha }} | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Checkout manifest
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          token: ${{ secrets.MANIFEST_PUSH_TOKEN }}
          path: manifest

      - name: Set image tags
        working-directory: manifest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          yq -i '.appVersion = strenv(TAG)' Chart.yaml
          yq -i '.php.image.tag = strenv(TAG) | .php.supervisord.image.tag = strenv(TAG) | .nginx.image.tag = strenv(TAG)' values.yaml
          git config user.name "demo5-ci"
          git config user.email "demo5-ci@cors.gmbh"
          git commit -am "update image tag to $TAG" || echo "nothing to commit"
          git push origin HEAD:main
